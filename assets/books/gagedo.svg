<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 57 232" width="57" height="232" role="img" aria-label="GAGEDO">
  <defs>
    <filter id="j" x="-32%" y="-6%" width="164%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="8" result="n">
        <animate attributeName="seed" values="8;-9;1;0" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="js" x="-22%" y="-40%" width="144%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="2" seed="-9" result="n">
        <animate attributeName="seed" values="-9;0;13;1" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.80" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- 책 -->
  <g filter="url(#j)" transform="rotate(0.82 28.5 202)">
    <rect x="50.5" y="-1" width="3" height="199" fill="#b3a884"/>
    <g stroke="#82785f" stroke-width="0.5" opacity="0.4" fill="none">
      <path d="M51 16.51 h2.4"/>
      <path d="M51 29.61 h2.4"/>
      <path d="M51 35.19 h2.4"/>
    </g>
    <rect x="5" y="-5" width="47" height="207" rx="2.2" fill="#2e3b2b" stroke="#160d08" stroke-width="1.4"/>
    <rect x="5" y="-5" width="47" height="207" rx="2.2" fill="url(#lit)"/>
    <g stroke="#000000" stroke-width="0.8" opacity="0.13" fill="none">
      <path d="M27.11 8.4 V191.57"/>
      <path d="M25.73 7.7 V195.31"/>
      <path d="M39.83 3.96 V193.26"/>
    </g>
    <rect x="4" y="6.7" width="49" height="4.6" fill="#000000" opacity="0.30"/><rect x="4" y="6.7" width="49" height="1.2" fill="#ffffff" opacity="0.13"/>
    <rect x="4" y="35.31" width="49" height="4.6" fill="#000000" opacity="0.30"/><rect x="4" y="35.31" width="49" height="1.2" fill="#ffffff" opacity="0.13"/>
    <rect x="4" y="132.25" width="49" height="4.6" fill="#000000" opacity="0.30"/><rect x="4" y="132.25" width="49" height="1.2" fill="#ffffff" opacity="0.13"/>
    <rect x="4" y="186.7" width="49" height="4.6" fill="#000000" opacity="0.30"/><rect x="4" y="186.7" width="49" height="1.2" fill="#ffffff" opacity="0.13"/>
    <rect x="9" y="42.61" width="39" height="86.94" fill="none" stroke="#caa63a" stroke-width="1" opacity="0.85"/>
    <rect x="11" y="45.01" width="35" height="82.14" fill="none" stroke="#caa63a" stroke-width="0.5" opacity="0.5"/>
    <text transform="translate(28.5 89.23) rotate(90)" text-anchor="middle" dominant-baseline="central"
      font-family="Georgia, 'Times New Roman', 'Nanum Myeongjo', serif" font-weight="600" font-size="10.5" letter-spacing="0.6" fill="#ecd28a">GAGEDO</text>
    <rect x="5" y="-5" width="47" height="3" rx="1.4" fill="#000000" opacity="0.34"/>
    <rect x="5" y="199" width="47" height="3" rx="1.4" fill="#000000" opacity="0.42"/>
  </g>

  <!-- 선반 조각 (좌우로 넘치게 그려 이웃 타일과 이어짐) -->
  <g filter="url(#js)">
    <path d="M-9 222 H66 L57 232 H0 Z" fill="#160d08" opacity="0.5"/>
    <rect x="-9" y="202" width="75" height="18" fill="#2c1c0f"/>
    <rect x="-9" y="202" width="75" height="2.6" fill="#4a3422" opacity="0.6"/>
    <rect x="-9" y="214" width="75" height="4" fill="#000000" opacity="0.24"/>
    <path d="M-9 220.5 H66" stroke="#0c0603" stroke-width="1.6" opacity="0.75"/>
  </g>
</svg>
