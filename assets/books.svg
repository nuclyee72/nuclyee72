<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200"
     role="img" aria-label="저택 서재 책장의 낡은 책 한 줄 — 왼쪽은 똑바로 서 있고 오른쪽 몇 권은 왼쪽으로 기울어져 있음. 눌러서 펼치기.">
  <title>the books — 눌러서 펼치기</title>
  <defs>
    <linearGradient id="bkPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f1410"/><stop offset="1" stop-color="#160b08"/>
    </linearGradient>
    <linearGradient id="bkShelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1c"/><stop offset="1" stop-color="#180f09"/>
    </linearGradient>
    <radialGradient id="bkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e8a24e" stop-opacity="0"/>
    </radialGradient>
    <filter id="bkWig" x="-9%" y="-9%" width="118%" height="118%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="6" result="n">
        <animate attributeName="seed" values="6;2;11;4" dur="0.44s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bkWig2" x="-9%" y="-9%" width="118%" height="118%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n">
        <animate attributeName="seed" values="3;9;1;13" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="bkClip"><rect x="0" y="0" width="360" height="200" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#bkClip)">
    <g filter="url(#bkWig2)">
      <rect x="-20" y="-20" width="400" height="240" fill="url(#bkPanel)"/>
      <rect x="-20" y="150" width="400" height="70" fill="url(#bkShelf)"/>
      <rect x="-20" y="150" width="400" height="4" fill="#5c4230" opacity="0.7"/>
      <rect x="-20" y="16" width="400" height="12" fill="#241812"/>
    </g>
    <ellipse cx="176" cy="120" rx="200" ry="120" fill="url(#bkGlow)"/>

    <g filter="url(#bkWig)" stroke="#160d08" stroke-width="3.2">
      <!-- upright group (left) - 3 dark brown tones in rotation -->
      <g>
        <rect x="42" y="60" width="26" height="90" fill="#4a3122"/>
        <rect x="48" y="76" width="14" height="4" fill="#a8842e"/><rect x="48" y="132" width="14" height="4" fill="#a8842e"/>
      </g>
      <rect x="68" y="82" width="18" height="68" fill="#3a2417"/>
      <g>
        <rect x="86" y="52" width="30" height="98" fill="#5b3a28"/>
        <rect x="93" y="92" width="16" height="15" fill="#a8842e" opacity="0.85"/>
      </g>
      <rect x="116" y="92" width="15" height="58" fill="#4a3122"/>
      <g>
        <rect x="131" y="70" width="26" height="80" fill="#3a2417"/>
        <rect x="137" y="84" width="14" height="4" fill="#a8842e"/><rect x="137" y="128" width="14" height="4" fill="#a8842e"/>
      </g>
      <rect x="157" y="78" width="20" height="72" fill="#5b3a28"/>
      <g>
        <rect x="177" y="88" width="24" height="62" fill="#4a3122"/>
        <rect x="183" y="112" width="13" height="12" fill="#a8842e" opacity="0.8"/>
      </g>

      <!-- leaning group (right), tipping left - bases spaced so they do not overlap -->
      <g transform="translate(207 150) rotate(-9)">
        <rect x="0" y="-90" width="21" height="90" fill="#3a2417"/>
        <rect x="5" y="-76" width="12" height="4" fill="#a8842e"/><rect x="5" y="-20" width="12" height="4" fill="#a8842e"/>
      </g>
      <g transform="translate(245 150) rotate(-13)">
        <rect x="0" y="-96" width="24" height="96" fill="#5b3a28"/>
        <rect x="6" y="-80" width="14" height="11" fill="#a8842e" opacity="0.8"/>
      </g>
      <g transform="translate(263 150) rotate(-17)">
        <rect x="0" y="-76" width="17" height="76" fill="#4a3122"/>
      </g>
      <g transform="translate(281 150) rotate(-21)">
        <rect x="0" y="-64" width="14" height="64" fill="#3a2417"/>
      </g>
    </g>

    <rect width="360" height="200" fill="#ffcf8a" opacity="0.04"/>
    <radialGradient id="bkVig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.52"/>
    </radialGradient>
    <rect width="360" height="200" fill="url(#bkVig)"/>
    <text x="180" y="187" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-style="italic" font-size="13" fill="#d8c8a6" opacity="0.72">the books &#183; 눌러서 펼치기 &#9656;</text>
  </g>
  <rect x="1" y="1" width="358" height="198" rx="12" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="2.8"/>
</svg>
